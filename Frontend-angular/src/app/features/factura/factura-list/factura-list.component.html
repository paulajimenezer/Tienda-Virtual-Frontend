<div class="factura-list">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="card-title">Gestión de Facturas</h2>
      <button class="btn btn-success" (click)="showModal = true">Nueva Factura</button>
    </div>

    <div class="card-body">
      <!-- Filtros (visuales) -->
        <div class="filters mb-3">
          <div class="row">
            <div class="col-md-3">
              <input 
                type="text" 
                class="form-control" 
                placeholder="Buscar por número..."
              >
            </div>
            <div class="col-md-3">
              <input 
                type="text" 
                class="form-control" 
                placeholder="Buscar por cliente..."
              >
            </div>
            <div class="col-md-2">
              <button class="btn btn-secondary">Limpiar</button>
            </div>
          </div>
        </div>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Número</th>
              <th>Pedido</th>
              <th>Total</th>
              <th>Fecha Emisión</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>—</td>
              <td>—</td>
              <td>—</td>
              <td>—</td>
              <td>—</td>
              <td>
                <button class="btn btn-sm btn-primary">Editar</button>
                <button class="btn btn-sm btn-danger">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- Modal para crear/editar factura (no funcional) -->
<div class="modal fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nueva Factura</h5>
        <button type="button" class="close" (click)="showModal = false">
          <span>&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form>
          <div class="form-group">
            <label for="numero">Número de factura *</label>
            <input type="text" class="form-control" id="numero" placeholder="Ingrese el número de factura">
          </div>
          <div class="form-group">
            <label for="cliente">Cliente *</label>
            <input type="text" class="form-control" id="cliente" placeholder="Nombre del cliente">
          </div>
          <div class="form-group">
            <label for="pedido">Pedido asociado</label>
            <input type="text" class="form-control" id="pedido" placeholder="ID de pedido (opcional)">
          </div>
          <div class="form-group">
            <label for="fecha_emision">Fecha de emisión *</label>
            <input type="date" class="form-control" id="fecha_emision">
          </div>
          <div class="form-group">
            <label for="fecha_vencimiento">Fecha de vencimiento</label>
            <input type="date" class="form-control" id="fecha_vencimiento">
          </div>
          <div class="form-group">
            <label for="total">Total *</label>
            <input type="number" class="form-control" id="total" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="form-group">
            <label for="observaciones">Observaciones</label>
            <textarea class="form-control" id="observaciones" rows="3" placeholder="Notas u observaciones"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="showModal = false">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="showModal = false">Guardar</button>
      </div>
    </div>
  </div>
</div>
